name: Sync RESUME

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/swift-resume/**
      - .github/actions/setup-resume-build/**
      - .github/workflows/sync-resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-resume-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Resume Build
        uses: ./.github/actions/setup-resume-build

      - name: Test Fixtures
        run: |
          swift test --package-path scripts/swift-resume \
            --scratch-path .build-local/tests \
            --cache-path .build-local/cache --force-resolved-versions

      - name: Export RESUMEs
        run: |
          set -euo pipefail
          swift build -c release --package-path scripts/swift-resume \
            --scratch-path .build-local/release \
            --cache-path .build-local/cache --force-resolved-versions
          .build-local/release/release/sync-resume --root "$PWD"
          scripts/swift-resume/check-pdf.sh "$PWD"

      - name: Push RESUMEs
        run: |
          set -euo pipefail
          git add -- RESUME.txt RESUME.pdf

          if git diff --cached --quiet; then
            echo "Resume files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: regenerate resume from README"
          git push origin HEAD:main
