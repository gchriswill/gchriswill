name: Sync RESUME

on:
  push:
    branches:
      - main
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-resume-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc python3-reportlab fonts-dejavu-core

      - name: Generate RESUMEs
        run: /usr/bin/python3 scripts/sync_resume.py

      - name: Push RESUMEs
        shell: bash
        run: |
          set -euo pipefail
          git add -- RESUME.txt RESUME.pdf

          if git diff --cached --quiet; then
            echo "Resume files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: regenerate resume from README"
          git push origin HEAD:main
