name: Sync RESUME

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/sync_resume.py
      - scripts/swift-resume/**
      - scripts/qualify_swift_resume.py
      - scripts/inspect_resume_pdf.py
      - scripts/test_inspect_resume_pdf.py
      - scripts/test_resume_workflows.py
      - .github/workflows/qualify-swift-resume.yml
      - .github/workflows/sync-resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-resume-main
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/qualify-swift-resume.yml

  sync:
    needs: qualify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download qualified Swift exports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualified-resume-${{ github.run_id }}
          path: .qualification/qualified-export

      - name: Verify and publish qualified exports
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .qualification/qualified-export/commit.txt)" = "$(git rev-parse HEAD)"
          sha256sum --check .qualification/qualified-export/source.sha256
          (
            cd .qualification/qualified-export
            sha256sum --check exports.sha256
          )
          cp .qualification/qualified-export/RESUME.txt RESUME.txt
          cp .qualification/qualified-export/RESUME.pdf RESUME.pdf

      - name: Push RESUMEs
        shell: bash
        run: |
          set -euo pipefail
          git add -- RESUME.txt RESUME.pdf

          if git diff --cached --quiet; then
            echo "Resume files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: regenerate resume from README"
          git push origin HEAD:main
