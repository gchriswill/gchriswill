name: Setup Resume Build
description: Install the pinned Swift toolchain and the Pandoc, Cairo, FreeType, DejaVu, and poppler dependencies used by sync-resume.

runs:
  using: composite
  steps:
    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libcairo2-dev libfreetype-dev pandoc fonts-dejavu-core \
          poppler-utils \
          binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev \
          libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev \
          libz3-dev tzdata unzip zlib1g-dev
        echo 'c805f9436dbc268644c1d9584f01a601a653e028e08fd74b9b949f6cf8304d88  /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf' \
          | sha256sum --check

    - name: Install Swift
      shell: bash
      env:
        SWIFT_URL: https://download.swift.org/swift-6.3.2-release/ubuntu2404/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE-ubuntu24.04.tar.gz
        SWIFT_SHA256: 827b2e935b52425068729d277148f286b37886231299d71f9136bcffd7084339
        SWIFT_SIGNING_KEY: 52BB7E3DE28A71BE22EC05FFEF80A866B47A981F
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/swift-toolchain"
        mkdir -p "$work/gnupg"
        chmod 700 "$work/gnupg"
        curl -fsSL --retry 3 -o "$work/swift.tar.gz" "$SWIFT_URL"
        curl -fsSL --retry 3 -o "$work/swift.tar.gz.sig" "$SWIFT_URL.sig"
        echo "$SWIFT_SHA256  $work/swift.tar.gz" | sha256sum --check
        curl -fsSL --retry 3 --compressed -o "$work/keys.asc" https://www.swift.org/keys/all-keys.asc
        export GNUPGHOME="$work/gnupg"
        gpg --batch --quiet --import "$work/keys.asc"
        gpg --batch --status-fd 1 --verify "$work/swift.tar.gz.sig" "$work/swift.tar.gz" \
          | grep -E "^\[GNUPG:\] VALIDSIG .* ${SWIFT_SIGNING_KEY}$"
        mkdir -p "$work/root"
        tar -xzf "$work/swift.tar.gz" -C "$work/root" --strip-components=1
        echo "$work/root/usr/bin" >> "$GITHUB_PATH"
        "$work/root/usr/bin/swift" --version
